<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Хряк Симулятор 3D — Открытый мир</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="theme-color" content="#4a2e1b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Хряк Симулятор" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Russo+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=10" />
  <script>
    (function () {
      function showFatalError(title, detail) {
        var box = document.getElementById('js-error-banner');
        if (!box) {
          box = document.createElement('div');
          box.id = 'js-error-banner';
          box.style.cssText = [
            'position:fixed',
            'top:0',
            'left:0',
            'right:0',
            'z-index:99999',
            'background:linear-gradient(180deg,#b81d18 0%,#7a100d 100%)',
            'color:#fff7e6',
            'border-bottom:3px solid #ffd970',
            'padding:10px 38px 10px 12px',
            'font-family:monospace',
            'font-size:12px',
            'line-height:1.35',
            'box-shadow:0 4px 16px rgba(0,0,0,0.65)',
            'word-break:break-word',
            'white-space:pre-wrap',
            'max-height:45vh',
            'overflow-y:auto',
            'user-select:text',
            '-webkit-user-select:text'
          ].join(';');
          var closeBtn = document.createElement('button');
          closeBtn.textContent = '×';
          closeBtn.style.cssText = 'position:absolute;top:6px;right:10px;background:none;border:none;color:#ffd970;font-size:20px;font-weight:bold;cursor:pointer;';
          closeBtn.onclick = function () { box.style.display = 'none'; };
          box.appendChild(closeBtn);
          var content = document.createElement('div');
          content.id = 'js-error-text';
          box.appendChild(content);
          (document.body || document.documentElement).appendChild(box);
        }
        box.style.display = 'block';
        var txt = document.getElementById('js-error-text');
        if (txt) {
          txt.textContent += (txt.textContent ? '\n---\n' : '') + title + '\n' + detail;
        }
      }

      window.__showGameError = showFatalError;

      window.onerror = function (message, source, lineno, colno, error) {
        var file = source ? String(source).split('/').pop() : 'inline';
        var stack = (error && error.stack) ? ('\n' + error.stack) : '';
        showFatalError('JS ERROR: ' + message, 'Файл: ' + file + ' | Строка: ' + lineno + ':' + colno + stack);
        return false;
      };

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = reason && reason.message ? reason.message : String(reason);
        var stack = reason && reason.stack ? ('\n' + reason.stack) : '';
        showFatalError('UNHANDLED PROMISE REJECTION: ' + msg, stack);
      });
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="crosshair"></div>
  <div id="float-layer"></div>

  <!-- Верхний HUD + круглый радар 90x90 px в левом верхнем углу -->
  <div id="top-bar">
    <div class="hud-left-stack">
      <div class="hud-col">
        <div class="wood-pill" id="score-pill">
          <svg class="ui-svg" viewBox="0 0 32 32" fill="none">
            <path d="M9 6H23V13C23 17.5 19.8 20.5 16 20.5C12.2 20.5 9 17.5 9 13V6Z" fill="#ffd447" stroke="#24140d" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M9 8H5.5C4.5 8 4 8.8 4 9.8C4 13 6.2 15.2 9 15.5" stroke="#e8a838" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M23 8H26.5C27.5 8 28 8.8 28 9.8C28 13 25.8 15.2 23 15.5" stroke="#e8a838" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M16 20.5V25M11 25H21" stroke="#24140d" stroke-width="2.6" stroke-linecap="round"/>
            <rect x="10" y="25" width="12" height="3.5" rx="1.5" fill="#e8a838" stroke="#24140d" stroke-width="2.2"/>
          </svg>
          <span id="score-val">0</span>
        </div>

        <div class="wood-pill acorn-pill" id="acorn-pill">
          <svg class="ui-svg" viewBox="0 0 32 32" fill="none">
            <path d="M16 4C17.5 4 18.5 5.2 18.2 7" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M8 14C8 21.5 11.8 27 16 28.5C20.2 27 24 21.5 24 14H8Z" fill="#ffd23f" stroke="#24140d" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M6.5 12C6.5 8.8 10.5 7 16 7C21.5 7 25.5 8.8 25.5 12C25.5 13.8 23.5 14.5 16 14.5C8.5 14.5 6.5 13.8 6.5 12Z" fill="#9c5a25" stroke="#24140d" stroke-width="2.4"/>
          </svg>
          <span id="acorn-val">0/10</span>
        </div>
      </div>

      <div id="radar-row">
        <div id="radar-wrap">
          <canvas id="radar-canvas" width="90" height="90"></canvas>
        </div>
        <div id="zone-pill">Деревенская площадь</div>
      </div>
    </div>

    <div class="hud-col">
      <button class="hud-btn" id="btn-breed" style="display:none" hidden aria-hidden="true">
        <svg class="ui-svg" viewBox="0 0 32 32" fill="none">
          <path d="M5 11L3 5L11 8Z" fill="#e8a88c" stroke="#24140d" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M27 11L29 5L21 8Z" fill="#e8a88c" stroke="#24140d" stroke-width="2.4" stroke-linejoin="round"/>
          <ellipse cx="16" cy="18" rx="12" ry="10.5" fill="#f2bca0" stroke="#24140d" stroke-width="2.4"/>
          <path d="M11 8.2C14 7.2 18 7.2 21 8.2L20 11H12Z" fill="#2b211e"/>
          <circle cx="11" cy="14.5" r="1.7" fill="#24140d"/>
          <circle cx="21" cy="14.5" r="1.7" fill="#24140d"/>
          <ellipse cx="16" cy="20.5" rx="6.2" ry="4.4" fill="#f28d93" stroke="#24140d" stroke-width="2.2"/>
          <ellipse cx="13.8" cy="20.5" rx="1.3" ry="1.8" fill="#4f221e"/>
          <ellipse cx="18.2" cy="20.5" rx="1.3" ry="1.8" fill="#4f221e"/>
        </svg>
        <span>Обычный хряк</span>
      </button>

      <button class="hud-btn" id="btn-cam">
        <svg class="ui-svg" viewBox="0 0 32 32" fill="none">
          <path d="M3 16C6.5 9.5 11 7 16 7C21 7 25.5 9.5 29 16C25.5 22.5 21 25 16 25C11 25 6.5 22.5 3 16Z" fill="#fff6e3" stroke="#24140d" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="5.5" fill="#4b89c2" stroke="#24140d" stroke-width="2.2"/>
          <circle cx="16" cy="16" r="2.4" fill="#24140d"/>
          <circle cx="14.2" cy="14" r="1.4" fill="#ffffff"/>
        </svg>
        <span>3-е лицо</span>
      </button>

      <button class="hud-btn icon-only" id="btn-sound" aria-label="Звук">
        <svg class="ui-svg" viewBox="0 0 32 32" fill="none">
          <path d="M6 12H11L18 6V26L11 20H6V12Z" fill="#ffd466" stroke="#24140d" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M22 11.5C23.8 13.5 23.8 18.5 22 20.5" stroke="#fff5e1" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M25.5 8.5C28.5 12.2 28.5 19.8 25.5 23.5" stroke="#e8a838" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="hud-btn icon-only" id="btn-reset" aria-label="Сброс">
        <svg class="ui-svg" viewBox="0 0 32 32" fill="none">
          <path d="M25 15C25 20.5 20.5 25 15 25C9.5 25 5 20.5 5 15C5 9.5 9.5 5 15 5C18.5 5 21.5 6.8 23.3 9.5" stroke="#ffd970" stroke-width="3" stroke-linecap="round"/>
          <path d="M24 4.5V10.5H18" stroke="#ffd970" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Компактная янтарно-рубиновая комбо-панель сверху -->
  <div id="combo-panel">
    <div id="combo-card">
      <div id="combo-header">
        <span id="combo-pts">+0</span>
        <span id="combo-mult">x1</span>
      </div>
      <div id="combo-bar-wrap"><div id="combo-bar-fill"></div></div>
    </div>
    <div id="trick-feed"></div>
  </div>

  <div id="rotate-tip">Поверните телефон горизонтально</div>
  <div id="grab-badge">Схвачено</div>

  <div id="center-bottom-bar">
    <button id="tractor-btn">
      <svg class="ui-svg" viewBox="0 0 32 32" fill="none">
        <rect x="15" y="5" width="3" height="7" rx="1" fill="#453d3a" stroke="#24140d" stroke-width="2"/>
        <path d="M6 11H16V17H26V22H6V11Z" fill="#328be0" stroke="#24140d" stroke-width="2.3" stroke-linejoin="round"/>
        <circle cx="10.5" cy="22.5" r="5.5" fill="#2b2b30" stroke="#24140d" stroke-width="2.3"/>
        <circle cx="10.5" cy="22.5" r="2.2" fill="#f2be32"/>
        <circle cx="23" cy="24" r="3.8" fill="#2b2b30" stroke="#24140d" stroke-width="2.3"/>
      </svg>
      <span>СЕСТЬ В ТРАКТОР</span>
    </button>
  </div>

  <div id="pc-help">WASD — бег · Shift — нитро · Пробел — прыжок · ЛКМ/F — боднуть/гудок · E/ПКМ — пятак · R — рэгдолл · T — трактор · V — камера</div>

  <!-- Сенсорное управление -->
  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>

    <div id="action-pad">
      <button class="act-btn" id="btn-ragdoll">
        <svg class="act-svg" viewBox="0 0 32 32" fill="none">
          <path d="M16 4L18.2 10.2L24.8 9.2L20.5 14.2L24.5 19.5L18 18.8L16 25L14 18.8L7.5 19.5L11.5 14.2L7.2 9.2L13.8 10.2L16 4Z" fill="#ffd970" stroke="#24140d" stroke-width="2.3" stroke-linejoin="round"/>
          <circle cx="16" cy="14.5" r="2.6" fill="#fff5e1"/>
        </svg>
        <span>РЭГДОЛЛ</span>
      </button>

      <button class="act-btn" id="btn-snout">
        <svg class="act-svg" viewBox="0 0 32 32" fill="none">
          <ellipse cx="16" cy="13.5" rx="11" ry="8" fill="#f29aa0" stroke="#24140d" stroke-width="2.4"/>
          <ellipse cx="12" cy="13.5" rx="2.1" ry="3" fill="#4f221e"/>
          <ellipse cx="20" cy="13.5" rx="2.1" ry="3" fill="#4f221e"/>
          <path d="M11 19.5V24.5C11 27.2 13.2 29 16 29C18.8 29 21 27.2 21 24.5V19.5" fill="#ff6699" stroke="#24140d" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M16 20V26" stroke="#b82c5c" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>ПЯТАК</span>
      </button>

      <button class="act-btn" id="btn-butt">
        <svg class="act-svg" viewBox="0 0 32 32" fill="none">
          <path d="M16 3L19.5 9.5L27 7L23.5 14L29 18.5L22 21.5L23.5 28.5L16 24.5L8.5 28.5L10 21.5L3 18.5L8.5 14L5 7L12.5 9.5L16 3Z" fill="#ffb838" stroke="#24140d" stroke-width="2.3" stroke-linejoin="round"/>
          <path d="M16 9L18 14L23 15L19 18.5L20 23L16 20.5L12 23L13 18.5L9 15L14 14L16 9Z" fill="#fff6d6"/>
        </svg>
        <span>БОДНУТЬ</span>
      </button>

      <button class="act-btn tractor-act-btn" id="btn-tr-horn">
        <svg class="act-svg" viewBox="0 0 32 32" fill="none">
          <path d="M6 13H11L21 7V25L11 19H6V13Z" fill="#ffd447" stroke="#24140d" stroke-width="2.3" stroke-linejoin="round"/>
          <path d="M24 11.5C26.2 13.8 26.2 18.2 24 20.5" stroke="#fff5e1" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M27 8.5C30.2 12.2 30.2 19.8 27 23.5" stroke="#ffd970" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>ГУДОК</span>
      </button>

      <button class="act-btn tractor-act-btn" id="btn-tr-nitro">
        <svg class="act-svg" viewBox="0 0 32 32" fill="none">
          <path d="M17.5 3L7 18H15L13 29L25 13H17L17.5 3Z" fill="#ffd970" stroke="#24140d" stroke-width="2.4" stroke-linejoin="round"/>
        </svg>
        <span>НИТРО</span>
      </button>

      <button class="act-btn" id="btn-jump">
        <svg class="act-svg" viewBox="0 0 32 32" fill="none">
          <path d="M16 4L27 16H20.5V27.5H11.5V16H5L16 4Z" fill="#ffd970" stroke="#24140d" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M16 8.5L21 14H17.5V24.5H14.5V14H11L16 8.5Z" fill="#fff9db"/>
        </svg>
        <span>ПРЫЖОК</span>
      </button>
    </div>
  </div>
  <script type="module" src="./game.js?v=10"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('Service Worker registration skipped:', err);
        });
      });
    }
  </script>
</body>
</html>
